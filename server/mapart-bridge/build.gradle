plugins { id 'net.fabricmc.fabric-loom' version '1.16.3' }
group = 'net.mineandcraft'
version = '1.3.0'
base { archivesName = 'mineandcraft-mapart' }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.nucleoid.xyz/' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.163.0+26.3'
    implementation 'maven.modrinth:image2map:0.15.0+26.3'
    implementation 'eu.pb4:map-canvas-api:0.9.0+26.2'
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
loom { runs { server { vmArgs '-Xmx512m', '-XX:MaxMetaspaceSize=256m' } } }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'mineandcraft_mapart_test'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform(); systemProperty 'java.awt.headless', 'true' }
jar { from('../../LICENSE') }
