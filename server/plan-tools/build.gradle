plugins { id 'net.fabricmc.fabric-loom' version '1.16.3' }
group = 'net.mineandcraft'
version = '1.2.0'
base { archivesName = 'mineandcraft-plan-tools' }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.163.0+26.3'
    // Pin the actual Fabric artifact; Plan shares version numbers across loaders.
    implementation 'maven.modrinth:planned:MUnIgib6'
    // The schematic isolation mixins are validated against this exact Fabric release.
    implementation 'maven.modrinth:worldedit:ByRNkO83'
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
loom { runs { server { vmArgs '-Xmx768m', '-XX:MaxMetaspaceSize=256m' } } }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'mineandcraft_plan_tools_test'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }
jar { from('../../LICENSE') }
