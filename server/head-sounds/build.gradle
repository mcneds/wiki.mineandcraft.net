plugins { id 'net.fabricmc.fabric-loom' version '1.16.3' }
group = 'net.mineandcraft'
version = '1.0.0'
base { archivesName = 'mineandcraft-head-sounds' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.163.0+26.3'
    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
loom { runs { server { vmArgs '-Xmx512m', '-XX:ActiveProcessorCount=2', '-XX:TieredStopAtLevel=1' } } }
fabricApi { configureTests { createSourceSet = true; modId = 'mineandcraft_heads_test'; enableGameTests = true; enableClientGameTests = false; eula = true } }
tasks.register('generateHeadTestPack', Exec) {
    commandLine 'python', 'generate_test_pack.py', layout.buildDirectory.dir('generated/head-tests').get().asFile
    inputs.files('generate_test_pack.py', '../../scripts/music-server.py')
    outputs.dir(layout.buildDirectory.dir('generated/head-tests'))
}
sourceSets.gametest.resources.srcDir(layout.buildDirectory.dir('generated/head-tests/data'))
tasks.named('processGametestResources') { dependsOn 'generateHeadTestPack' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }
jar { from('../../LICENSE') }
